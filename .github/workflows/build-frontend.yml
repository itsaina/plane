name: Build plane-frontend custom image

on:
  workflow_dispatch:
    inputs:
      plane_ref:
        description: 'Branch or tag to build from (e.g. v1.3.0)'
        required: true
        default: 'v1.3.0'
  push:
    branches:
      - custom-build

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: makeplane/plane
          ref: ${{ github.event.inputs.plane_ref || 'v1.3.0' }}
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push plane-frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile.web
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/plane-frontend:latest
            ghcr.io/${{ github.repository_owner }}/plane-frontend:${{ github.event.inputs.plane_ref || 'v1.3.0' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
